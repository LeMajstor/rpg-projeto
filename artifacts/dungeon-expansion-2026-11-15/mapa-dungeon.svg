<text x="40" y="1040" font-size="28">Como chegar ao andar 2</text>
<text x="40" y="1085" font-size="23">1. Entre pela saída sul do andar 1 e siga ao norte pelo saguão.</text>
<text x="40" y="1128" font-size="23">2. Acione a alavanca na passagem central para abrir o portão.</text>
<text x="40" y="1171" font-size="23">3. Na galeria leste, siga ao norte até as escadas e pressione E.</text>
<text x="40" y="1250" font-size="28">Perseguição territorial</text>
<text x="40" y="1295" font-size="23">Detecção: 180 unidades, com paredes bloqueando a visão. Território: faixa fixa de 240 unidades em torno da rota laranja.</text>
<text x="40" y="1338" font-size="23">Ao perder visão, o inimigo retoma o trecho acessível mais próximo. Novas detecções não deslocam seu território.</text>
<text x="40" y="1381" font-size="23">Contato só com o líder inicia batalha. Fuga bem-sucedida remove o encontro da sessão. M2 continua sem fuga em batalha.</text>
<text x="40" y="1470" font-size="20" fill="#a8bfbd">Mapa externo de orientação; a câmera do jogo mantém a escala anterior e acompanha o líder.</text>
</g></svg>
